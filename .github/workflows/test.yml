name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Route coverage & registry consistency
        run: node tests/coverage.test.js
      - name: API transport & region health
        run: node tests/api.test.js
