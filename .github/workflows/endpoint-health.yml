name: Camera Endpoint Health

on:
  schedule:
    - cron: '0 6 * * *' # daily
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/api.js'
      - 'js/cameras.js'
      - 'scripts/probe-endpoints.mjs'
      - 'tests/endpoint-expectations.json'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe all camera endpoints
        id: probe
        run: node scripts/probe-endpoints.mjs --json endpoint-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-report
          path: endpoint-report.json
          if-no-files-found: ignore
      # On scheduled runs, surface breakage as a single rolling issue instead
      # of a silent red workflow nobody looks at
      - name: Report broken regions as an issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'The scheduled camera endpoint health check found broken regions. ';
            body += `See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the full report.\n\n`;
            try {
              const report = JSON.parse(fs.readFileSync('endpoint-report.json', 'utf-8'));
              const bad = report.results.filter(r => r.status !== 'ok' && r.status !== 'degraded');
              body += '| Region | Status | Notes |\n|---|---|---|\n';
              body += bad.map(r => `| ${r.region} | ${r.status} | ${(r.note || '').slice(0, 200)} |`).join('\n');
            } catch (e) {
              body += '(report file unavailable)';
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'endpoint-health',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Camera endpoints broken for one or more regions',
                labels: ['endpoint-health'],
                body,
              });
            }
